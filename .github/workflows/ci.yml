name: CI Pipeline & Golden Case Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Golden Case Gate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: TypeScript Strict Check
        run: npx tsc --noEmit

      - name: Unit Tests & Golden Case Gate (Vitest)
        run: npm run test:ci

      - name: Next.js Production Build
        run: npm run build
