name: CI Pipeline & Golden Case Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Golden Case Gate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom@30 (a real devDependency, used by the unit test suite) requires
          # Node ^22.22.2 || ^24.15.0 || >=26.0.0 — it does not run on Node 20 at
          # all. This was invisible locally (dev machine runs Node 26) and only
          # surfaced on a real CI runner pinned to 20, which is exactly why this
          # got caught here instead of staying a silent landmine.
          node-version: 24
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: TypeScript Strict Check
        run: npx tsc --noEmit

      - name: Unit Tests & Golden Case Gate (Vitest)
        run: npm run test:ci

      - name: Next.js Production Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Critical-Path Tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
